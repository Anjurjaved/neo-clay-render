name: render-library
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma-separated item ids, or ALL"
        default: "ALL"
      shards:
        description: "parallel machines (max 20)"
        default: "20"
      scale:
        description: "render scale (0.5 = 540x960, 1 = 1080x1920)"
        default: "0.5"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(int('${{ inputs.shards }}')))))")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 fonts-noto-color-emoji >/dev/null || true
      - run: node tools/ci_render.mjs ${{ matrix.shard }} ${{ inputs.shards }} ${{ inputs.scale }} swangle
        env:
          IDS: ${{ inputs.ids }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.shard }}
          path: out/renders/
          retention-days: 7
          if-no-files-found: ignore
